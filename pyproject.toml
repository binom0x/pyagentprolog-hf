[build-system]
requires = ["setuptools>=81.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagentprolog-hf"
version = "1.0.2"
description = "Hugging Face integration for PyAgentProlog: PreTrainedModel, Pipeline, Hub upload."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Andrey Vorfolomeev", email = "binom0x@proton.me"}
]
keywords = [
    "prolog", "logic-programming", "ai", "agents",
    "huggingface", "transformers", "neuro-symbolic",
    "pyagentprolog",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Interpreters",
]

dependencies = [
    "pyagentprolog>=1.0.1,<2.0.0",
    "transformers>=5.12.0,<6.0",
    "huggingface_hub>=1.21.0,<2.0",
    "numpy>=1.26.4,<2.0",
]

[project.optional-dependencies]
semantic-st = [
    "sentence-transformers>=6.0.1,<7.0",
]

semantic-ollama = [
    "langchain-ollama>=1.0.1,<2.0",
]

semantic = [
    "sentence-transformers>=6.0.1,<7.0",
    "langchain-ollama>=1.0.1,<2.0",
]

hub = [
    "huggingface_hub[cli]>=1.21.0,<2.0",
]

numba = [
    "numba>=0.67.0",
]

test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

all = [
    "sentence-transformers>=6.0.1,<7.0",
    "langchain-ollama>=1.0.1,<2.0",
    "huggingface_hub[cli]>=1.21.0,<2.0",
    "numba>=0.67.0",
]

[project.urls]
Homepage = "https://github.com/binom0x/pyagentprolog"
Repository = "https://github.com/binom0x/pyagentprolog.git"

[project.entry-points."transformers.models"]
pyagentprolog = "pyagentprolog_hf.registration:register_with_transformers"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyagentprolog_hf*"]

[tool.setuptools.package-data]
pyagentprolog_hf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"